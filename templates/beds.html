<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Beds | Hospital KRR System</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        .page-container {
            padding: 35px;
        }

        .page-heading {
            color: #163d67;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .page-description {
            color: #65758b;
            margin-bottom: 25px;
            font-size: 16px;
        }

        .bed-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 22px;
        }

        .bed-card {
            background: white;
            border: 1px solid #dce5ef;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 12px rgba(20, 55, 90, 0.08);
            transition: 0.2s;
        }

        .bed-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 7px 18px rgba(20, 55, 90, 0.15);
        }

        .bed-icon {
            width: 55px;
            height: 55px;
            background: #e8f1fb;
            color: #163d67;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
            margin-bottom: 15px;
        }

        .bed-card h2 {
            color: #163d67;
            margin-bottom: 15px;
            font-size: 23px;
        }

        .bed-card p {
            margin: 9px 0;
            color: #334155;
            font-size: 15px;
        }

        .bed-label {
            font-weight: bold;
            color: #163d67;
        }

        .status-badge {
            display: inline-block;
            margin-top: 12px;
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        .available {
            background: #e6f7ed;
            color: #168044;
        }

        .occupied {
            background: #fff0f0;
            color: #c62828;
        }

        .back-button {
            display: inline-block;
            margin-top: 30px;
            background: #163d67;
            color: white;
            padding: 12px 22px;
            border-radius: 7px;
            text-decoration: none;
            font-weight: bold;
        }

        .back-button:hover {
            background: #0d2b4b;
        }

        @media (max-width: 700px) {
            .page-container {
                padding: 20px;
            }

            .bed-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="page-container">

        <h1 class="page-heading">Hospital Beds</h1>

        <p class="page-description">
            Check the current availability of hospital beds.
        </p>

        <div class="bed-grid">

            {% for bed in beds %}

            <div class="bed-card">

                <div class="bed-icon">🛏️</div>

                <h2>Bed {{ bed.bed_number }}</h2>

                <p>
                    <span class="bed-label">Bed Type:</span>
                    {{ bed.bed_type }}
                </p>

                <p>
                    <span class="bed-label">Status:</span>
                    {{ bed.status }}
                </p>

                {% if bed.status == "Available" %}
                    <span class="status-badge available">
                        Available
                    </span>
                {% else %}
                    <span class="status-badge occupied">
                        Occupied
                    </span>
                {% endif %}

            </div>

            {% endfor %}

        </div>

        <a class="back-button" href="{{ url_for('index') }}">
            ← Back to Dashboard
        </a>

    </div>

</body>
</html>
